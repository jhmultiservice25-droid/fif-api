name: Import FIF API Source

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Clone source repository
        run: |
          git clone --depth 1 https://github.com/musanzi/fif-api.git /tmp/fif-source
          rm -rf /tmp/fif-source/.git

      - name: Replace destination with source snapshot
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          find /tmp/fif-source -mindepth 1 -maxdepth 1 ! -name '.github' -exec cp -a {} . \;

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import source from musanzi/fif-api"
          git push origin main
